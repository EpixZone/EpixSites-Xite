name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check JavaScript and run regressions
        run: |
          node --version
          for file in js/*.js js/utils/*.js scripts/*.cjs; do node --check "$file"; done
          node --test tests/*.test.cjs
          node scripts/removals.cjs verify
